services:
  - type: web
    name: vtirs-api
    runtime: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/index.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: STORAGE_BUCKET
        value: documents
      # Opt-in to DELETING unreferenced blobs in the nightly orphan sweep.
      # Leave unset/false until the DB/bucket pairing is verified — otherwise
      # the sweep only logs. See sweepOrphanStorage().
      - key: STORAGE_SWEEP_ENABLED
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads