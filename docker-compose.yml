services:
  postgres:
    image: postgres:15
    container_name: vtirs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vtirs
      POSTGRES_PASSWORD: vtirs_dev_password
      POSTGRES_DB: vtirs
    ports:
      - "5433:5432"
    volumes:
      - vtirs_pgdata:/var/lib/postgresql/data

volumes:
  vtirs_pgdata:
